<!doctype html><html><head><meta charset="utf-8"><title>NW.js on Elbrus</title>
<style>body{font-family:sans-serif;margin:24px;background:#f6f3ee}h1{color:#9b3d2a}td{padding:2px 10px}canvas{border:1px solid #999}</style></head>
<body><h1>NW.js on Elbrus (e2k)</h1><div id="info"></div><canvas id="c" width="300" height="100"></canvas><pre id="out"></pre>
<script>
(async () => {
  const os = require('os'), fs = require('fs'), path = require('path');
  const OUT = process.env.SMOKE_OUT || path.join(os.tmpdir(), 'nw-e2k-smoke'); fs.mkdirSync(OUT, { recursive: true });
  const v = process.versions, out = { versions: { nw: v.nw, chromium: v.chromium, node: v.node, v8: v.v8 }, arch: process.arch, platform: os.platform(), cpus: os.cpus().length };
  document.getElementById('info').innerHTML = '<table>' + ['nw', 'chromium', 'node', 'v8'].map(k => `<tr><td>${k}</td><td><b>${v[k]}</b></td></tr>`).join('') + `<tr><td>arch</td><td><b>${process.arch}</b></td></tr></table>`;
  let s = performance.now(); const fib = n => n < 2 ? n : fib(n - 1) + fib(n - 2); out.fib30 = [fib(30), +(performance.now() - s).toFixed(1)];
  out.intl = new Intl.DateTimeFormat('ru-RU', { dateStyle: 'full' }).format(new Date(2026, 10, 25));
  out.fsRead = fs.readFileSync('/proc/cpuinfo', 'utf8').split('\n').find(l => /model name|cpu family/.test(l));
  out.crypto = require('crypto').createHash('sha256').update('Эльбрус').digest('hex').slice(0, 16);
  out.zlib = require('zlib').gunzipSync(require('zlib').gzipSync('e2k'.repeat(100))).length;
  try { const w = await WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11])); out.wasm = w.instance.exports.add(20, 22); } catch (e) { out.wasm = String(e); }
  try { const a = require(process.env.SMOKE_ADDON || path.join(nw.__dirname, 'addon/build/Release/e2kaddon.node')); out.addon = [a.hello(), a.add(2, 40)]; } catch (e) { out.addon = String(e.message).slice(0, 200); }
  out.manifest = nw.App.manifest.name;
  const c = document.getElementById('c').getContext('2d'); c.fillStyle = '#9b3d2a'; c.fillRect(0, 0, 300, 100); c.fillStyle = '#fff'; c.font = '26px sans-serif'; c.fillText('nw.js canvas', 70, 60);
  document.getElementById('out').textContent = JSON.stringify(out, null, 1);
  await new Promise(r => setTimeout(r, 800));
  nw.Window.get().capturePage(buf => {
    try { fs.writeFileSync(path.join(OUT, 'shot.png'), buf); out.shot = 'ok'; } catch (e) { out.shot = String(e); }
    fs.writeFileSync(path.join(OUT, 'result.json'), JSON.stringify(out, null, 1));
    process.stdout.write('NW-SMOKE ' + JSON.stringify(out) + '\n');
    if (!process.env.SMOKE_STAY) setTimeout(() => nw.App.quit(), 800);
  }, { format: 'png', datatype: 'buffer' });
})();
</script></body></html>
